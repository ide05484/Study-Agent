# main에 Backend/supabase 변경이 push되면 DB 마이그레이션과 Edge Functions를 Supabase에 배포한다.
# GitHub 저장소 Secrets(SUPABASE_ACCESS_TOKEN, SUPABASE_DB_PASSWORD, SUPABASE_PROJECT_ID)가 없으면 건너뛴다.
name: Supabase Deploy

on:
  push:
    branches: [main]
    paths: ['Backend/supabase/**', '.github/workflows/supabase-deploy.yml']
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: Backend
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
      SUPABASE_PROJECT_ID: ${{ secrets.SUPABASE_PROJECT_ID }}
    steps:
      - name: Secrets 미설정 시 건너뜀
        if: env.SUPABASE_ACCESS_TOKEN == ''
        run: echo "Supabase secrets가 없어 배포를 건너뜁니다. DEPLOY.md를 참고해 등록하세요."
      - uses: actions/checkout@v4
        if: env.SUPABASE_ACCESS_TOKEN != ''
      - uses: supabase/setup-cli@v1
        if: env.SUPABASE_ACCESS_TOKEN != ''
        with:
          version: latest
      - name: 프로젝트 연결
        if: env.SUPABASE_ACCESS_TOKEN != ''
        run: supabase link --project-ref "$SUPABASE_PROJECT_ID" --password "$SUPABASE_DB_PASSWORD"
      - name: DB 마이그레이션 배포
        if: env.SUPABASE_ACCESS_TOKEN != ''
        run: supabase db push --password "$SUPABASE_DB_PASSWORD"
      - name: Edge Functions 배포
        if: env.SUPABASE_ACCESS_TOKEN != ''
        run: supabase functions deploy --use-api --project-ref "$SUPABASE_PROJECT_ID"
